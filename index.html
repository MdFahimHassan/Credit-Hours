<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Credit Hours</title>
  <!-- Without this tag phones lay the page out 980px wide and shrink it: the game would be tiny and the controls unusable. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a22">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    html, body { margin:0; height:100%; background:#1a1a22; overflow:hidden; overscroll-behavior:none; }
    /* position:fixed + inset:0 = exactly the visible area (100vh is taller than the screen on phones: it ignores the browser's address bar) */
    body { position:fixed; inset:0; display:flex; justify-content:center; align-items:center;
           touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
    /* display.js sets the exact size (a whole number of device pixels where possible); this is only the fallback before it runs */
    canvas { width:min(100vw, calc(100dvh * 4 / 3)); aspect-ratio:4 / 3; image-rendering:pixelated; display:block; }
    /* phone held upright: the game sits at the top and the thumb controls get the empty space below it */
    @media (orientation: portrait) and (pointer: coarse) { body { align-items:flex-start; padding-top:env(safe-area-inset-top); } }

    /* ---- touch controls (shown on touch screens only, see input.js) ---- */
    #touch { display:none; position:fixed; inset:0; pointer-events:none; z-index:5; }
    body.touch #touch { display:block; }
    #touch .pad { position:absolute; pointer-events:auto; touch-action:none; border-radius:50%;
                  background:rgba(255,255,255,0.10); border:2px solid rgba(255,255,255,0.30); box-sizing:border-box; }
    #stick { width:128px; height:128px; left:calc(18px + env(safe-area-inset-left)); bottom:calc(18px + env(safe-area-inset-bottom)); }
    #knob  { position:absolute; left:50%; top:50%; width:56px; height:56px; margin:-28px 0 0 -28px; border-radius:50%;
             background:rgba(255,255,255,0.35); border:2px solid rgba(255,255,255,0.55); transition:transform 0.05s; will-change:transform; }
    #btnE  { width:84px; height:84px; right:calc(24px + env(safe-area-inset-right)); bottom:calc(34px + env(safe-area-inset-bottom));
             font:bold 30px monospace; color:rgba(255,255,255,0.85); display:flex; align-items:center; justify-content:center; background:rgba(126,217,87,0.22); border-color:rgba(126,217,87,0.6); }
    #btnE.down, #stick.down { background:rgba(255,255,255,0.25); }
    #rotate { display:none; position:fixed; left:0; right:0; top:calc(env(safe-area-inset-top) + 75vw + 8px); text-align:center;
              font:12px monospace; color:rgba(255,255,255,0.45); pointer-events:none; }
    @media (orientation: portrait) { body.touch #rotate { display:block; } }
  </style>
</head>
<body>
  <canvas id="game" width="640" height="480"></canvas>
  <div id="touch">
    <div id="stick" class="pad"><div id="knob"></div></div>
    <div id="btnE" class="pad">E</div>
  </div>
  <div id="rotate">Turn your phone sideways for a bigger view</div>
  <!-- type="module" lets us use import/export. It REQUIRES a local server (see README). -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
